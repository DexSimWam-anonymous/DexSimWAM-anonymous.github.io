<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drawer RSI — 3D trajectory viewer</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./three.module.js"}}</script></head><body><main><header><div><p class="eyebrow">RSI EVALUATION · INTERACTIVE REPLAY</p><h1>Drawer Trajectory Viewer</h1></div><div id="status" class="status"></div></header><section class="toolbar card"><label>Eval step<select id="step"></select></label><label>Trajectory<select id="trajectory"></select></label><button id="prev" type="button">← Previous</button><button id="next" type="button">Next →</button></section><section class="stats" id="stats"></section><section class="viewer-grid"><div class="viewport-card card"><div id="viewport"><div id="loading">Loading 3D trajectory…</div><div class="orbit-hint">Drag to rotate · wheel to zoom · right-drag to pan</div></div><div class="playback"><button id="play" type="button">Play</button><input id="time" type="range" min="0" max="1" step="0.01" value="0"><output id="clock">0.00 / 0.00 s</output><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="overview" type="button">Overview</button><button id="closeup" type="button">Hand close-up</button></div></div><aside class="side"><section class="card panel"><h2>Current frame</h2><dl id="live"></dl></section><section class="card panel dof-panel"><div class="panel-title"><h2>58-DoF robot state</h2></div><div id="dof-table" class="state-table"></div></section><section class="card panel"><h2>Drawer state</h2><div id="drawer-table" class="state-table"></div></section></aside></section></main><script type="module" src="app.js?v=public-cleanup"></script></body></html>
