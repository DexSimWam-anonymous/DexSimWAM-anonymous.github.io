<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">DexSimWAM: execution and recursive self-improvement</title>
  <desc id="desc">A vision-language agent dispatches a suitable registered Task-WAM for closed-loop execution. Capability gaps trigger diagnostic probes, simulation data synthesis, post-training and evaluation. Evaluation feedback drives further diagnosis. Model registration requires whole-task success and prior-skill regression checks.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#6386cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 7 4-7 4" fill="none" stroke="#589e8c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 2px; }
      .title { font-size: 22px; font-weight: 600; fill: #253753; }
      .body { font-size: 16px; fill: #6b7b94; }
      .small { font-size: 14px; fill: #6b7b94; }
      .blue-line { fill: none; stroke: #6386cb; stroke-width: 2; marker-end: url(#arrow-blue); }
      .green-line { fill: none; stroke: #589e8c; stroke-width: 2; marker-end: url(#arrow-green); }
    </style>
  </defs>
  <rect width="1400" height="680" rx="16" fill="#fff"/>
  <text x="48" y="49" class="label" fill="#5176b7">REASON &amp; EXECUTE</text>
  <text x="1352" y="49" text-anchor="end" class="small" fill="#8190a5">A growing family of task-scoped policies</text>

  <!-- Registered skills form the execution path. -->
  <rect x="48" y="117" width="190" height="142" rx="12" fill="#f7f9fc" stroke="#e1e7f0"/>
  <path d="M126 143h34a5 5 0 0 1 5 5v17a5 5 0 0 1-5 5h-20l-9 7v-7h-5a5 5 0 0 1-5-5v-17a5 5 0 0 1 5-5Z" fill="none" stroke="#8599b7" stroke-width="2"/>
  <text x="143" y="211" text-anchor="middle" class="title">Instruction</text>
  <text x="143" y="238" text-anchor="middle" class="body">Task request</text>
  <path d="M239 187h58" class="blue-line"/>

  <rect x="308" y="117" width="235" height="142" rx="12" fill="#edf3ff" stroke="#c8d8f3"/>
  <circle cx="425" cy="157" r="17" fill="#fff" stroke="#a9c2ef"/>
  <path d="m415 157 7 6 13-13" fill="none" stroke="#6086ca" stroke-width="2"/>
  <text x="425" y="211" text-anchor="middle" class="title">VLM agent</text>
  <text x="425" y="238" text-anchor="middle" class="body">Reason &amp; dispatch</text>
  <path d="M544 187h100" class="blue-line"/>
  <text x="594" y="161" text-anchor="middle" class="small">Within scope</text>

  <rect x="654" y="89" width="340" height="205" rx="12" fill="#f4f7fd" stroke="#d2ddf1"/>
  <text x="824" y="125" text-anchor="middle" class="title">Task-WAM family</text>
  <rect x="675" y="146" width="298" height="36" rx="7" fill="#fff" stroke="#e0e7f3"/>
  <rect x="675" y="190" width="144" height="36" rx="7" fill="#fff" stroke="#e0e7f3"/>
  <rect x="829" y="190" width="144" height="36" rx="7" fill="#fff" stroke="#e0e7f3"/>
  <text x="824" y="170" text-anchor="middle" class="body" fill="#5272a8">PnP · PnP6D</text>
  <text x="747" y="214" text-anchor="middle" class="body">Teapot</text>
  <text x="901" y="214" text-anchor="middle" class="body">Drawer</text>
  <text x="824" y="265" text-anchor="middle" class="small">Trash bin · newly acquired specialists</text>
  <path d="M995 187h105" class="blue-line"/>
  <text x="1047" y="161" text-anchor="middle" class="small">Execute</text>

  <rect x="1111" y="117" width="241" height="142" rx="12" fill="#edf7f3" stroke="#cbe4d9"/>
  <path d="M1215 155a17 17 0 0 1 30-7m1-7v9h-9m10 14a17 17 0 0 1-30 7m-1 7v-9h9" fill="none" stroke="#74a696" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1231" y="211" text-anchor="middle" class="title">Closed-loop control</text>
  <text x="1231" y="238" text-anchor="middle" class="body">Dexterous manipulation</text>

  <!-- Capability gaps feed the RSI loop; registration is gated by evaluation. -->
  <rect x="48" y="367" width="1304" height="246" rx="14" fill="#f6faf8" stroke="#dfebe5"/>
  <text x="73" y="404" class="label" fill="#5e9482">RECURSIVE SELF-IMPROVEMENT</text>
  <text x="1325" y="404" text-anchor="end" class="small">Targeted data · Continual acquisition · Prior-skill checks</text>
  <path d="M425 260v62H30v170h35" class="green-line"/>
  <path d="M1327 492h45V337H894v-32" class="green-line"/>
  <rect x="242" y="307" width="143" height="27" rx="5" fill="#fff"/>
  <text x="313" y="326" text-anchor="middle" class="small" fill="#548f7e">Capability gap</text>
  <rect x="989" y="321" width="190" height="29" rx="5" fill="#fff"/>
  <text x="1084" y="341" text-anchor="middle" class="small" fill="#548f7e">Register validated model</text>

  <rect x="75" y="443" width="246" height="98" rx="10" fill="#fff" stroke="#d6e5dd"/>
  <text x="97" y="473" class="small" fill="#7ca090">01</text>
  <text x="198" y="489" text-anchor="middle" class="title" style="font-size:20px">Diagnose</text>
  <text x="198" y="516" text-anchor="middle" class="small">Adapt diagnostic probes</text>
  <path d="M322 492h64" class="green-line"/>

  <rect x="398" y="443" width="246" height="98" rx="10" fill="#fff" stroke="#d6e5dd"/>
  <text x="420" y="473" class="small" fill="#7ca090">02</text>
  <text x="521" y="489" text-anchor="middle" class="title" style="font-size:20px">Synthesize data</text>
  <text x="521" y="516" text-anchor="middle" class="small">Diverse, randomized simulation</text>
  <path d="M645 492h64" class="green-line"/>

  <rect x="721" y="443" width="246" height="98" rx="10" fill="#fff" stroke="#d6e5dd"/>
  <text x="743" y="473" class="small" fill="#7ca090">03</text>
  <text x="844" y="489" text-anchor="middle" class="title" style="font-size:20px">Post-train</text>
  <text x="844" y="516" text-anchor="middle" class="small">Update or instantiate a Task-WAM</text>
  <path d="M968 492h64" class="green-line"/>

  <rect x="1044" y="443" width="282" height="98" rx="10" fill="#eaf5ef" stroke="#bcd9ca"/>
  <text x="1066" y="473" class="small" fill="#7ca090">04</text>
  <text x="1185" y="489" text-anchor="middle" class="title" style="font-size:20px">Evaluate &amp; validate</text>
  <text x="1185" y="516" text-anchor="middle" class="small">Whole-task success + regression</text>
  <path d="M1185 542v37H198v-27" class="green-line" stroke-dasharray="6 5"/>
  <rect x="553" y="565" width="290" height="27" rx="4" fill="#f6faf8"/>
  <text x="698" y="584" text-anchor="middle" class="small" fill="#548f7e">Evaluation feedback guides the next iteration</text>
  <text x="48" y="651" class="small" fill="#8d98aa">Conceptual framework based on the paper abstract</text>
</svg>
